<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#0077ff"/>
      <stop offset="100%" stop-color="#0044cc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Icon -->
  <g transform="translate(4, 5)">
    <circle cx="25" cy="25" r="23" fill="url(#logoGrad)" filter="url(#glow)"/>
    <circle cx="25" cy="25" r="22" fill="#04122e" fill-opacity="0.6"/>
    <!-- Globe / Swoop Lines -->
    <path d="M12 25 A13 13 0 0 0 38 25" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <ellipse cx="25" cy="25" rx="10" ry="21" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M16 16 L34 34 M34 16 L27 16 M34 16 L34 23" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Text -->
  <text x="65" y="32" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="800" font-size="22" fill="#ffffff" letter-spacing="-0.5">
    GlobalEcom<tspan fill="#38bdf8">Pro</tspan>
  </text>
  <text x="65" y="46" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="600" font-size="7.5" fill="#94a3b8" letter-spacing="1.8">
    E-COMMERCE GROWTH PARTNER
  </text>
</svg>
